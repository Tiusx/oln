name = "blog-cms"
main = "src/index.ts"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

# --- Bindings ---
[[d1_databases]]
binding = "DB"
database_name = "oln"
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "blog-media"

[[kv_namespaces]]
binding = "CACHE"
id = "REPLACE_WITH_YOUR_KV_NAMESPACE_ID"

# --- Workers Dev / Assets serving ---
# The admin SPA (apps/admin) is built into ./public, served at /admin/* by this Worker.
# `binding` exposes the assets as a Fetcher so the Worker can serve the SPA with
# its own fallback (the Hono app always returns a Response, so we can't rely on
# the platform's auto-serving).
[assets]
directory = "./public"
not_found_handling = "single-page-application"
binding = "ASSETS"  # DISABLED for local dev (ZodError)
