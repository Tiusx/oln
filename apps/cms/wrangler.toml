name = "oln"
main = "src/index.ts"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

# --- Bindings ---
[[d1_databases]]
binding = "DB"
database_name = "oln"
database_id = "0d59d0f3-6c53-430f-ac90-5fe09110d196"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "blog-media"

[[kv_namespaces]]
binding = "CACHE"
id = "79a289a5959f412598fbced061c6930a"

# --- Workers Dev / Assets serving ---
# The admin SPA (apps/admin) is built into ./public, served at /admin/* by this Worker.
# `binding` exposes the assets as a Fetcher so the Worker can serve the SPA with
# its own fallback (the Hono app always returns a Response, so we can't rely on
# the platform's auto-serving).
[assets]
directory = "./public"
not_found_handling = "single-page-application"
binding = "ASSETS"  # DISABLED for local dev (ZodError)
