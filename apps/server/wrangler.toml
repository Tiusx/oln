name = "oln"
main = "src/index.ts"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

# --- Bindings ---
[[d1_databases]]
binding = "DB"
database_name = "oln"
database_id = "5483427e-0acc-40c0-bd47-eb53dd018af7"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "blog-media"

[[kv_namespaces]]
binding = "CACHE"
id = "a8661e7cfd024c75b9c3110ee40bc450"

# --- Workers Dev / Assets serving ---
# The admin SPA (apps/admin) is built into ./public, served at /admin/* by this Worker.
# `binding` exposes the assets as a Fetcher so the Worker can serve the SPA with
# its own fallback (the Hono app always returns a Response, so we can't rely on
# the platform's auto-serving).
[assets]
directory = "./public"
not_found_handling = "single-page-application"
binding = "ASSETS"  # DISABLED for local dev (ZodError)

[observability]
enabled = false
head_sampling_rate = 1
redact_query_string = false

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = false
persist = true
head_sampling_rate = 1